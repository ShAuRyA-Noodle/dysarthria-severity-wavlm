name: Python smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  wavlm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check dependency resolution
        run: |
          python -m pip install uv
          uv pip compile requirements.txt --python-version 3.11 --python-platform windows --output-file /tmp/atd-requirements.txt --quiet
      - name: Install CPU smoke test dependencies
        run: |
          python -m pip install 'torch==2.14.0+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=5.17.0,<6.0' 'numpy>=1.26.4,<2.0' 'pandas>=2.2.2,<3.0' 'soundfile>=0.14.0,<0.15' 'tqdm>=4.70.1,<5.0'
      - name: Compile and test WavLM extraction
        run: |
          python -m compileall -q src experiments
          python -m unittest discover -s tests -v
